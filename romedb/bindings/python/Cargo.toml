[package]
name = "romedb-python"
version = "0.2.9"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
romedb = { path = "../../frontend" }
pyo3 = { version = "=0.29.0", features = ["abi3-py310", "extension-module"] }
romedb-protocol = { path = "../protocol" }
serde_json.workspace = true
